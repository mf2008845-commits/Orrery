<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orrery</title>
    <meta
      name="description"
      content="A dark, living model of the solar system. Pause time, change its speed, and fly the camera to any planet."
    />
    <meta name="theme-color" content="#07080b" />
    <!-- Inlined so the single-file build needs no companion files at all. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080b'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%2396a0af' stroke-width='1.2' transform='rotate(-18 16 16)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f0b060'/%3E%3Ccircle cx='5.6' cy='12.2' r='2' fill='%238eb4d4'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #07080b;
      }

      /* ---------- launch screen ---------- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(36, 42, 52, 0.55) 0%, rgba(7, 8, 11, 0) 58%),
          #07080b;
        opacity: 1;
        transition: opacity 700ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      #splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        transform: translateY(-2vh);
        animation: splash-in 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      #splash .splash-mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 26px;
        display: grid;
        place-items: center;
      }

      #splash .splash-orbit {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(150, 160, 175, 0.28);
        border-radius: 50%;
        transform: scaleY(0.36) rotate(-18deg);
      }

      #splash .splash-orbit.is-two {
        transform: scaleY(0.36) rotate(18deg);
        border-color: rgba(150, 160, 175, 0.14);
      }

      #splash .splash-sun {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f0b060;
        box-shadow:
          0 0 18px rgba(240, 176, 96, 0.55),
          0 0 46px rgba(240, 176, 96, 0.22);
        animation: splash-pulse 2.6s ease-in-out infinite;
      }

      #splash .splash-planet {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #8eb4d4;
        box-shadow: 0 0 10px rgba(142, 180, 212, 0.55);
        transform: translateX(48px);
      }

      #splash .splash-rotor {
        position: absolute;
        inset: 0;
        transform: scaleY(0.36) rotate(-18deg);
      }

      #splash .splash-spinner {
        position: absolute;
        inset: 0;
        animation: splash-spin 7s linear infinite;
      }

      #splash .splash-title {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0.52em;
        text-indent: 0.52em;
        text-transform: uppercase;
        color: #ece5d6;
      }

      #splash .splash-sub {
        margin: 12px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: rgba(230, 201, 125, 0.86);
      }

      #splash .splash-bar {
        width: 168px;
        height: 2px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      #splash .splash-bar span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(230, 201, 125, 0) 0%, #e6c97d 55%, rgba(230, 201, 125, 0) 100%);
        animation: splash-sweep 1.6s ease-in-out infinite;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(-2vh) scale(1);
        }
      }

      @keyframes splash-pulse {
        0%,
        100% {
          box-shadow:
            0 0 18px rgba(240, 176, 96, 0.5),
            0 0 46px rgba(240, 176, 96, 0.2);
        }
        50% {
          box-shadow:
            0 0 26px rgba(240, 176, 96, 0.7),
            0 0 64px rgba(240, 176, 96, 0.3);
        }
      }

      @keyframes splash-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .splash-inner,
        #splash .splash-sun,
        #splash .splash-spinner,
        #splash .splash-bar span {
          animation: none;
        }
        #splash .splash-spinner {
          transform: rotate(210deg);
        }
        #splash {
          transition-duration: 200ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading the orrery">
      <div class="splash-inner">
        <div class="splash-mark" aria-hidden="true">
          <span class="splash-orbit"></span>
          <span class="splash-orbit is-two"></span>
          <span class="splash-sun"></span>
          <span class="splash-rotor">
            <span class="splash-spinner"><span class="splash-planet"></span></span>
          </span>
        </div>
        <p class="splash-title">Orrery</p>
        <p class="splash-sub">Nathanael with Pride</p>
        <div class="splash-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        var hideTimer = null;

        /* Fade out, then park the node so it can be shown again. */
        window.__hideSplash = function () {
          if (!splash) return;
          splash.classList.add("is-done");
          window.clearTimeout(hideTimer);
          hideTimer = window.setTimeout(function () {
            if (splash) splash.style.display = "none";
          }, 800);
        };

        /* Reuse the launch screen as a loading cover (galaxy → solar system).
           It has to appear instantly, so the fade-in transition is skipped. */
        window.__showSplash = function () {
          if (!splash) return;
          window.clearTimeout(hideTimer);
          splash.style.display = "grid";
          splash.style.transition = "none";
          splash.classList.remove("is-done");
          void splash.offsetWidth;
          window.requestAnimationFrame(function () {
            if (splash) splash.style.transition = "";
          });
        };

        /* Safety net: never trap the user behind the launch screen. */
        window.setTimeout(function () {
          window.__hideSplash();
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
